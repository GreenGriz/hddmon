[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hddmon"
version = "0.2.0"
description = "Мониторинг и прогноз состояния HDD по SMART"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hddmon = "hddmon.cli:main"

[tool.setuptools.packages.find]
include = ["hddmon*"]
